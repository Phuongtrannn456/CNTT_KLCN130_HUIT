services:
  - type: web
    name: k12-web3-backend
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        value: wgv-internal-security-secret-key-2026
      - key: FRONTEND_URL
        value: https://frontend-blush-three-8x6ecte1wh.vercel.app
      - key: ML_SERVICE_URL
        sync: false
      - key: BLOCKCHAIN_NETWORK
        value: Sepolia
      - key: BLOCKCHAIN_RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: K12_CREDENTIAL_CONTRACT_ADDRESS
        value: 0x0000000000000000000000000000000000000000
